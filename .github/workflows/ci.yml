name: CI
on:
  # Push runs only on the default branch: feature branches are covered by
  # their pull_request run, so the same commit never builds twice.
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main

# Cancel superseded in-progress runs when new commits land on the same
# branch/PR, so rapid pushes don't stack up duplicate macOS desktop builds.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      VITE_GLITCHTIP_DSN: ${{ secrets.VITE_GLITCHTIP_DSN }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run typecheck
        run: pnpm typecheck
      - name: Run web build
        run: pnpm build
  # A version bump pushed to main is built and published by release.yml, so
  # skip the duplicate macOS build here. Any other push/PR keeps building.
  version-bump:
    name: Detect version bump
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      is_release: ${{ steps.detect.outputs.is_release }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Compare version with parent commit
        id: detect
        shell: bash
        run: |
          current="$(sed -n 's/^[[:space:]]*"version":[[:space:]]*"\([^"]*\)".*/\1/p' src-tauri/tauri.conf.json | head -1)"
          previous="$(git show HEAD^:src-tauri/tauri.conf.json 2>/dev/null | sed -n 's/^[[:space:]]*"version":[[:space:]]*"\([^"]*\)".*/\1/p' | head -1)"

          if [[ -n "$current" && "$current" != "$previous" ]]; then
            echo "Version changed (${previous:-none} -> ${current}); release.yml handles this build."
            echo "is_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_release=false" >> "$GITHUB_OUTPUT"
          fi

  desktop-build:
    name: Desktop build (${{ matrix.platform.name }})
    needs: version-bump
    if: |
      always() &&
      needs.version-bump.outputs.is_release != 'true' &&
      !startsWith(github.ref, 'refs/heads/version/') &&
      !startsWith(github.ref, 'refs/heads/release/')
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: macOS
            runner: macos-latest
            bundles: app
    env:
      VITE_GLITCHTIP_DSN: ${{ secrets.VITE_GLITCHTIP_DSN }}
      CMAKE_DISABLE_FIND_PACKAGE_OpenSSL: "ON"
      # CI builds carry no Developer ID certificate; ad-hoc signing keeps the
      # Apple Silicon build runnable instead of failing to bundle.
      APPLE_SIGNING_IDENTITY: "-"
      GGML_NATIVE: "OFF"
      GGML_CPU_ARM_ARCH: "armv8.2-a"
      CMAKE_C_FLAGS: "-U__ARM_FEATURE_MATMUL_INT8"
      CMAKE_CXX_FLAGS: "-U__ARM_FEATURE_MATMUL_INT8"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Rust build outputs
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.platform.name }}-desktop
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Stage text enhancement sidecar
        run: pnpm build:text-enhance-sidecar
      - name: Stage Parakeet ASR sidecar
        run: pnpm build:parakeet-asr
      - name: Run Rust check
        working-directory: src-tauri
        run: cargo check --workspace
      - name: Run Rust tests
        working-directory: src-tauri
        run: cargo test --workspace
      - name: Build desktop app
        run: pnpm tauri build --bundles ${{ matrix.platform.bundles }} --config src-tauri/tauri.ci.conf.json
      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vox-${{ matrix.platform.name }}-desktop
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/**/*.app

