name: CI
on:
  push:
    branches-ignore:
      - "release/v*"
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      VITE_GLITCHTIP_DSN: ${{ secrets.VITE_GLITCHTIP_DSN }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run typecheck
        run: pnpm typecheck
      - name: Run web build
        run: pnpm build
  desktop-build:
    name: Desktop build (${{ matrix.platform.name }})
    if: |
      !startsWith(github.ref, 'refs/heads/version/') &&
      !startsWith(github.ref, 'refs/heads/release/')
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: macOS
            runner: macos-latest
            bundles: app
          - name: Windows
            runner: windows-latest
            bundles: nsis
          - name: Linux
            runner: ubuntu-22.04
            bundles: deb
    env:
      VITE_GLITCHTIP_DSN: ${{ secrets.VITE_GLITCHTIP_DSN }}
      GGML_NATIVE: "OFF"
      GGML_CPU_ARM_ARCH: "armv8.2-a"
      CMAKE_C_FLAGS: "-U__ARM_FEATURE_MATMUL_INT8"
      CMAKE_CXX_FLAGS: "-U__ARM_FEATURE_MATMUL_INT8"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install Linux system dependencies
        if: matrix.platform.name == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            curl \
            file \
            libasound2-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf \
            pkg-config \
            wget
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Rust build outputs
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.platform.name }}-desktop
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Stage text enhancement sidecar
        run: pnpm build:text-enhance-sidecar
      - name: Stage Parakeet ASR sidecar
        run: pnpm build:parakeet-asr
      - name: Run Rust check
        working-directory: src-tauri
        run: cargo check --workspace
      - name: Build desktop app
        run: pnpm tauri build --bundles ${{ matrix.platform.bundles }} --config src-tauri/tauri.ci.conf.json
      - name: Upload macOS artifacts
        if: matrix.platform.name == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: vox-${{ matrix.platform.name }}-desktop
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/**/*.app
      - name: Upload Windows artifacts
        if: matrix.platform.name == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: vox-${{ matrix.platform.name }}-desktop
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/**/*.exe
            src-tauri/target/release/bundle/**/*.msi
      - name: Upload Linux artifacts
        if: matrix.platform.name == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: vox-${{ matrix.platform.name }}-desktop
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/**/*.AppImage
            src-tauri/target/release/bundle/**/*.deb
            src-tauri/target/release/bundle/**/*.rpm
