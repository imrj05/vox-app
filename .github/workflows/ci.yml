name: CI
on:
  # Push runs only on the default branch: feature branches are covered by
  # their pull_request run, so the same commit never builds twice.
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main

# Cancel superseded in-progress runs when new commits land on the same
# branch/PR, so rapid pushes don't stack up duplicate macOS desktop builds.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      VITE_GLITCHTIP_DSN: ${{ secrets.VITE_GLITCHTIP_DSN }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run typecheck
        run: pnpm typecheck
      - name: Run web build
        run: pnpm build
  desktop-build:
    name: Desktop build (${{ matrix.platform.name }})
    if: |
      !startsWith(github.ref, 'refs/heads/version/') &&
      !startsWith(github.ref, 'refs/heads/release/')
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: macOS
            runner: macos-latest
            bundles: app
    env:
      VITE_GLITCHTIP_DSN: ${{ secrets.VITE_GLITCHTIP_DSN }}
      GGML_NATIVE: "OFF"
      GGML_CPU_ARM_ARCH: "armv8.2-a"
      CMAKE_C_FLAGS: "-U__ARM_FEATURE_MATMUL_INT8"
      CMAKE_CXX_FLAGS: "-U__ARM_FEATURE_MATMUL_INT8"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Rust build outputs
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.platform.name }}-desktop
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Stage text enhancement sidecar
        run: pnpm build:text-enhance-sidecar
      - name: Stage Parakeet ASR sidecar
        run: pnpm build:parakeet-asr
      - name: Run Rust check
        working-directory: src-tauri
        run: cargo check --workspace
      - name: Build desktop app
        run: pnpm tauri build --bundles ${{ matrix.platform.bundles }} --config src-tauri/tauri.ci.conf.json
      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vox-${{ matrix.platform.name }}-desktop
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/**/*.app

