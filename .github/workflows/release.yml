name: Release

on:
  push:
    branches:
      - main
      - "release/v*"
      - "version/*"
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to publish, for example v0.1.1"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  # Cheap gate: a push to main only becomes a release when the version in
  # src-tauri/tauri.conf.json has no published release yet. Other triggers
  # always proceed.
  version-gate:
    name: Check for unreleased version
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.check.outputs.should_release }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect new version
        id: check
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" != push || "$GITHUB_REF" != refs/heads/main ]]; then
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          version="$(node -p "JSON.parse(require('node:fs').readFileSync('src-tauri/tauri.conf.json', 'utf8')).version")"
          tag="v${version}"

          # Checking the release (not just the tag) means a failed publish is
          # retried by the next push to main instead of being skipped forever.
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already published; skipping release build."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "Release $tag is missing; releasing."
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          fi

  # The release tag is resolved and created once, before the per-architecture
  # builds fan out, so both legs publish into the same release.
  resolve-version:
    name: Resolve release tag
    needs: version-gate
    if: needs.version-gate.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release tag
        id: resolve
        shell: bash
        run: |
          version="$(node -p "JSON.parse(require('node:fs').readFileSync('src-tauri/tauri.conf.json', 'utf8')).version")"

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            release_tag="${{ github.event.inputs.release_tag }}"
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            release_tag="${GITHUB_REF#refs/tags/}"
          else
            release_tag="v${version}"
          fi

          if [[ ! "$release_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            echo "Release tag must look like v0.0.1. Got: $release_tag" >&2
            exit 1
          fi

          if [[ "$GITHUB_REF" == refs/heads/release/* || "$GITHUB_REF" == refs/heads/version/* ]]; then
            branch_release="${GITHUB_REF#refs/heads/release/}"
            branch_release="${branch_release#refs/heads/version/}"
            if [[ ! "$branch_release" == v* ]]; then
              branch_release="v${branch_release}"
            fi

            if [[ "$branch_release" != "$release_tag" ]]; then
              echo "Release branch ($branch_release) must match src-tauri version tag ($release_tag)." >&2
              exit 1
            fi
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo "Resolved release tag: $release_tag"

      - name: Create release tag if missing
        if: startsWith(github.ref, 'refs/heads/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.resolve.outputs.tag }}
        shell: bash
        run: |
          if git rev-parse "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Tag $RELEASE_TAG already exists locally."
          elif git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            git fetch origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
            echo "Fetched existing remote tag $RELEASE_TAG."
          else
            git tag "$RELEASE_TAG" "$GITHUB_SHA"
            git push origin "refs/tags/$RELEASE_TAG"
            echo "Created and pushed tag $RELEASE_TAG."
          fi

  # One native build per architecture: the sidecar builds (text enhancement,
  # Parakeet, Apple Speech) stage binaries for the host triple, so each runner
  # produces its own architecture without cross-compiling.
  build:
    name: Build ${{ matrix.arch_name }}
    needs: resolve-version
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch_name: aarch64
            runner: macos-15 # Apple Silicon, arm64
            host_arch: arm64
          - arch_name: x64
            runner: macos-15-intel # Intel, x86_64
            host_arch: x86_64
    env:
      RELEASE_TAG: ${{ needs.resolve-version.outputs.tag }}
      RELEASE_REPO: ${{ github.repository }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN || secrets.VITE_GLITCHTIP_DSN }}
      # macOS signing + notarization. The Tauri CLI imports APPLE_CERTIFICATE into a
      # temporary keychain and infers the signing identity from it, so the identity
      # is never committed to the repo.
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      GGML_NATIVE: "OFF"
      GGML_CPU_ARM_ARCH: "armv8.2-a"
      CMAKE_C_FLAGS: "-U__ARM_FEATURE_MATMUL_INT8"
      CMAKE_CXX_FLAGS: "-U__ARM_FEATURE_MATMUL_INT8"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify runner architecture
        shell: bash
        run: |
          arch="$(uname -m)"
          echo "Runner architecture: $arch (expected ${{ matrix.host_arch }})"
          if [[ "$arch" != "${{ matrix.host_arch }}" ]]; then
            echo "This leg must build the ${{ matrix.arch_name }} architecture, but the runner is $arch." >&2
            exit 1
          fi

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build outputs
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: macos-release-${{ matrix.arch_name }}

      - name: Validate release secrets
        shell: bash
        run: |
          if [[ -z "$TAURI_SIGNING_PRIVATE_KEY" ]]; then
            echo "Missing required secret: TAURI_SIGNING_PRIVATE_KEY" >&2
            exit 1
          fi

          if [[ -z "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" ]]; then
            echo "Missing required secret: TAURI_SIGNING_PRIVATE_KEY_PASSWORD" >&2
            exit 1
          fi

          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [[ -z "${!name}" ]]; then
              echo "Missing required secret: $name" >&2
              exit 1
            fi
          done

      - name: Configure signing identity
        # Only exported when the secret exists: an empty APPLE_SIGNING_IDENTITY
        # makes the bundler look for an identity literally named "".
        env:
          IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        shell: bash
        run: |
          if [[ -n "$IDENTITY" ]]; then
            echo "APPLE_SIGNING_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
            echo "Signing with identity from secret: $IDENTITY"
          else
            echo "APPLE_SIGNING_IDENTITY not set; using the identity from APPLE_CERTIFICATE."
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build changelog
        run: pnpm changelog:build

      - name: Add changelog to updater manifest notes
        shell: bash
        run: |
          {
            echo "RELEASE_NOTES<<EOF"
            cat release/release-notes.md
            echo "EOF"
          } >> "$GITHUB_ENV"

      - name: Build desktop app
        run: pnpm desktop:build

      - name: Prepare updater assets
        run: pnpm release:prepare

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vox-${{ matrix.arch_name }}
          if-no-files-found: error
          path: |
            release/*.dmg
            release/*.app.tar.gz
            release/latest.json
            release/release-metadata.json

  publish:
    name: Publish release
    needs: [resolve-version, build]
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ needs.resolve-version.outputs.tag }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: vox-*
          path: artifacts

      - name: Merge updater manifests
        # Each architecture wrote its own single-platform latest.json; the updater
        # needs one manifest listing aarch64 and x64 together.
        run: node scripts/merge-updater-manifests.mjs artifacts

      - name: Build changelog
        run: node scripts/build-changelog.mjs

      - name: Create or update GitHub Release
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --title "$RELEASE_TAG" --notes-file release/release-notes.md
          else
            gh release create "$RELEASE_TAG" --title "$RELEASE_TAG" --notes-file release/release-notes.md --target "$GITHUB_SHA"
          fi

      - name: Upload release assets
        shell: bash
        run: |
          # Collect by glob so the step does not depend on how the artifact upload
          # nests the files it received.
          mapfile -t dmgs < <(find artifacts -type f -name '*.dmg')
          mapfile -t archives < <(find artifacts -type f -name '*.app.tar.gz')

          if [[ ${#dmgs[@]} -ne 2 || ${#archives[@]} -ne 2 ]]; then
            echo "Expected 2 installer images and 2 updater archives. Found:" >&2
            printf '  %s\n' "${dmgs[@]}" "${archives[@]}" >&2
            exit 1
          fi

          gh release upload "$RELEASE_TAG" "${dmgs[@]}" "${archives[@]}" release/latest.json --clobber
