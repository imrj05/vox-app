<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="./favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f2f2f0" />
    <script>
      // Apply the saved (or OS) theme before the first paint. The app reads the
      // class on mount; this only prevents a light flash for dark visitors.
      (() => {
        try {
          const stored = localStorage.getItem("vox-theme");
          const isDark = stored
            ? stored === "dark"
            : window.matchMedia("(prefers-color-scheme: dark)").matches;
          document.documentElement.classList.toggle("dark", isDark);
          document.documentElement.style.colorScheme = isDark ? "dark" : "light";
          const meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute("content", isDark ? "#121211" : "#f2f2f0");
        } catch {
          // Keep the light defaults if storage is unavailable.
        }
      })();
    </script>
    <title>Vox — Private dictation for macOS</title>
    <meta
      name="description"
      content="Vox turns speech into text in any macOS app, on-device. Press a hotkey, speak, and the words land at your cursor. Apple Speech, Parakeet, and Whisper, routed locally."
    />
    <meta property="og:title" content="Vox — Private dictation for macOS" />
    <meta
      property="og:description"
      content="Private, local-first dictation for macOS. Press a hotkey, speak, and the words land at your cursor."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
