<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">Vox app icon</title>
  <desc id="desc">A microphone, waveform, and text cue on a rounded responsive tile.</desc>
  <style>
    :root {
      --tile-bg: #ffffff;
      --tile-stroke: #f4f6f8;
      --shadow: #d8dce3;
      --ink: #1b2d35;
      --line-muted: #bce9df;
      --line-faint: #d4f3ee;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --tile-bg: #172123;
        --tile-stroke: #263b3f;
        --shadow: #020617;
        --ink: #f2fffc;
        --line-muted: #5eead4;
        --line-faint: #2dd4bf;
      }
    }
  </style>
  <defs>
    <linearGradient id="mic-gradient" x1="286" y1="306" x2="500" y2="748" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#98ead8"/>
      <stop offset="0.55" stop-color="#27c5b3"/>
      <stop offset="1" stop-color="#14b8a6"/>
    </linearGradient>
    <linearGradient id="wave-gradient" x1="556" y1="374" x2="748" y2="634" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#a7f3e5"/>
      <stop offset="0.55" stop-color="#45d1c0"/>
      <stop offset="1" stop-color="#14b8a6"/>
    </linearGradient>
    <filter id="tile-shadow" x="36" y="42" width="952" height="964" color-interpolation-filters="sRGB" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="24" stdDeviation="30" flood-color="var(--shadow)" flood-opacity="0.46"/>
    </filter>
    <filter id="glyph-shadow" x="180" y="250" width="760" height="620" color-interpolation-filters="sRGB" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#0f766e" flood-opacity="0.16"/>
    </filter>
  </defs>
  <g filter="url(#tile-shadow)">
    <rect x="96" y="94" width="832" height="832" rx="190" fill="var(--tile-bg)"/>
    <rect x="97.5" y="95.5" width="829" height="829" rx="188.5" fill="none" stroke="var(--tile-stroke)" stroke-width="3"/>
  </g>
  <g filter="url(#glyph-shadow)">
    <rect x="300" y="332" width="172" height="236" rx="86" fill="url(#mic-gradient)"/>
    <path d="M236 466v54c0 118 70 194 150 194s150-76 150-194v-54" fill="none" stroke="url(#mic-gradient)" stroke-linecap="round" stroke-width="44"/>
    <path d="M386 714v64" fill="none" stroke="#18bcae" stroke-linecap="round" stroke-width="44"/>
    <path d="M320 778h132" fill="none" stroke="#18bcae" stroke-linecap="round" stroke-width="44"/>
    <path d="M576 482v48" fill="none" stroke="#97e8da" stroke-linecap="round" stroke-width="28"/>
    <path d="M624 446v120" fill="none" stroke="#7bdfcf" stroke-linecap="round" stroke-width="28"/>
    <path d="M672 390v232" fill="none" stroke="url(#wave-gradient)" stroke-linecap="round" stroke-width="28"/>
    <path d="M720 460v106" fill="none" stroke="#85e3d4" stroke-linecap="round" stroke-width="28"/>
    <path d="M790 390h92" fill="none" stroke="var(--ink)" stroke-linecap="round" stroke-width="28"/>
    <path d="M836 414v78" fill="none" stroke="var(--ink)" stroke-linecap="round" stroke-width="28"/>
    <path d="M790 548h100" fill="none" stroke="#25bdae" stroke-linecap="round" stroke-width="26"/>
    <path d="M790 608h100" fill="none" stroke="var(--line-muted)" stroke-linecap="round" stroke-width="26"/>
    <path d="M790 668h100" fill="none" stroke="var(--line-faint)" stroke-linecap="round" stroke-width="26"/>
  </g>
</svg>
