[workspace]
members = [".", "crates/vox-text-enhance"]
resolver = "2"

[package]
name = "vox"
version = "0.0.9"
description = "Vox desktop app"
authors = ["Vox"]
edition = "2021"

[lib]
name = "vox_lib"
crate-type = ["staticlib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
arboard = "3.4"
cpal = "0.17.3"
enigo = "0.2"
hound = "3.5.1"
reqwest = "0.13.3"
tokio = { version = "1", features = ["fs", "io-util", "rt-multi-thread", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["macos-private-api", "tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2.3.1"
tauri-plugin-process = "2.3.0"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-updater = "2.10.1"
whisper-rs = "0.15.1"
sentry = { version = "0.48.2", default-features = false, features = ["panic", "reqwest", "rustls"] }
tauri-plugin-single-instance = "2"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
core-graphics = { version = "0.24", features = ["highsierra"] }
objc = "0.2"
whisper-rs = { version = "0.15.1", features = ["metal"] }
# Converts the floating widget/enhance windows to NSPanels so they can be
# drawn over other apps' full-screen Spaces (plain NSWindows cannot).
tauri-nspanel = { git = "https://github.com/ahkohd/tauri-nspanel", branch = "v2.1" }
