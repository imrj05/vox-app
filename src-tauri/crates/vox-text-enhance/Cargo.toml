[package]
name = "vox-text-enhance"
version = "0.0.6"
description = "Local text enhancement sidecar for Vox"
authors = ["Vox"]
edition = "2021"

[[bin]]
name = "vox-text-enhance"
path = "src/main.rs"

[dependencies]
encoding_rs = "0.8.35"
llama-cpp-2 = { version = "0.1.146", features = ["sampler"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
