<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">Vox app icon</title>
  <desc id="desc">A microphone, waveform, and text cue on a rounded light tile.</desc>
  <defs>
